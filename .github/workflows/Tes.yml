name: Upload TWRP Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup branch foxtest
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin foxtest; then
            git checkout -B foxtest origin/foxtest
          else
            git checkout -b foxtest
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync
          pip install gdown

      - name: Download TWRP ZIP from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1_6Wt1kZ6QRi1OuKipy-o6DklqLc3ScTB" -O twrp.zip

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q twrp.zip -d extracted

          if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && \
             [ -d "$(find extracted -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
          else
            SRC="extracted"
          fi

          echo "Source directory: $SRC"

      - name: Upload TWRP source
        run: |
          if [ -d extracted ]; then
            SRC="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
            if [ "$(find extracted -mindepth 1 -maxdepth 1 | wc -l)" -ne 1 ] || [ ! -d "$SRC" ]; then
              SRC="extracted"
            fi
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SRC"/ ./

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Upload TWRP device tree"
          git push origin foxtest
