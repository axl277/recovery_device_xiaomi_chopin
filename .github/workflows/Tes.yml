name: Upload TWRP Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup branch foxtest
        run: |
          if git ls-remote --exit-code --heads origin foxtest; then
            git checkout -B foxtest origin/foxtest
          else
            git checkout -b foxtest
          fi

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          pip install gdown

      - name: Download ZIP
        run: |
          gdown "https://drive.google.com/uc?id=1_6Wt1kZ6QRi1OuKipy-o6DklqLc3ScTB" -O /tmp/twrp.zip

      - name: Extract ZIP outside repository
        run: |
          mkdir -p /tmp/twrp-extracted
          unzip -q /tmp/twrp.zip -d /tmp/twrp-extracted

          COUNT=$(find /tmp/twrp-extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find /tmp/twrp-extracted -mindepth 1 -maxdepth 1 -type d)" ]; then
            SRC="$(find /tmp/twrp-extracted -mindepth 1 -maxdepth 1 -type d)"
          else
            SRC="/tmp/twrp-extracted"
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Copy TWRP source
        run: |
          # Hapus source lama, pertahankan Git dan workflow.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          # Salin seluruh source baru.
          cp -a "$SRC"/. .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Upload TWRP device tree"
          git push origin foxtest
