name: Upload TWRP Device Tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: foxtest
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          pip install gdown

      - name: Download ZIP from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1_6Wt1kZ6QRi1OuKipy-o6DklqLc3ScTB" -O /tmp/twrp.zip

          test -s /tmp/twrp.zip
          unzip -t /tmp/twrp.zip

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/twrp-source
          unzip -q /tmp/twrp.zip -d /tmp/twrp-source

          COUNT=$(find /tmp/twrp-source -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find /tmp/twrp-source -mindepth 1 -maxdepth 1 -type d)" ]; then
            SRC="$(find /tmp/twrp-source -mindepth 1 -maxdepth 1 -type d)"
          else
            SRC="/tmp/twrp-source"
          fi

          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Copy TWRP source
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf -- {} +

          cp -a "$SRC"/. .

      - name: Commit and push
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Upload TWRP device tree from Google Drive"

          git push origin HEAD:foxtest
